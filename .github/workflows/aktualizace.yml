# Jednou měsíčně stáhne nová data ARES, RES a RÚIAN, zpracuje je a výsledek pošle jako pull request.
# Když zpracování selže (např. změna struktury souboru), založí issue s popisem chyby.
name: Aktualizace dat o subjektech

on:
  schedule:
    - cron: "23 4 6 * *"     # 6. den v měsíci (ČSÚ, ARES i RÚIAN mají touto dobou data za minulý měsíc)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: aktualizace-dat
  cancel-in-progress: false

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # zdrojová data (~1,5 GB) nejsou v repozitáři; cache drží poslední stažené verze
      # a stahuje se jen to, co je na serveru novější
      - name: Obnovení stažených dat
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-subjekty-${{ github.run_id }}
          restore-keys: data-subjekty-

      - name: Stažení dat a číselníků
        run: python stahni_data.py

      - name: Zpracování
        id: zpracovani
        continue-on-error: true
        run: python zpracuj_data.py > "$RUNNER_TEMP/zpracovani.log" 2>&1

      - name: Uložení stažených dat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-subjekty-${{ github.run_id }}

      - name: Issue – zpracování selhalo
        if: steps.zpracovani.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/zpracovani.log`, 'utf8');
            const behu = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const telo = [
              'Automatická aktualizace nedokázala zpracovat data ARES / RES / RÚIAN.',
              'Nejspíš se změnila struktura souboru – zpracování je potřeba upravit',
              '(`zpracuj_data.py`, `ares_vr.py`).',
              '',
              `Běh: ${behu}`,
              '',
              '```',
              log.slice(-60000),
              '```',
            ].join('\n');
            const stitek = 'zmena-struktury';
            const otevrene = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: stitek,
            });
            if (otevrene.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: otevrene.data[0].number, body: telo,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'Aktualizace dat o subjektech selhala – nutná úprava zpracování',
                body: telo, labels: [stitek],
              });
            }
            core.setFailed('Zpracování selhalo, založeno issue.');

      - name: Přehled kontrol jako artefakt
        if: steps.zpracovani.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kontrola
          path: vystup/kontrola.html

      - name: Text pull requestu
        if: steps.zpracovani.outcome == 'success'
        id: pr
        run: |
          stav=$(cat vystup/kontrola_stav.txt)
          datum=$(tail -n 1 vystup/kontrola_souctu.csv | cut -d, -f2)
          {
            cat vystup/kontrola_souhrn.md
            echo
            echo "Přehled kontrol: artefakt **kontrola** v [běhu workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Před sloučením projdi přehled kontrol a změny v CSV."
          } > "$RUNNER_TEMP/pr.md"
          if [ "$stav" = "chyba" ]; then predpona="⚠️ Kontrola nesedí – "; else predpona=""; fi
          echo "titulek=${predpona}Aktualizace dat o subjektech (stav k ${datum})" >> "$GITHUB_OUTPUT"

      - name: Pull request se změnami
        if: steps.zpracovani.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: aktualizace-dat
          delete-branch: true
          commit-message: "Aktualizace dat o subjektech"
          title: ${{ steps.pr.outputs.titulek }}
          body-path: ${{ runner.temp }}/pr.md
          labels: aktualizace-dat
          add-paths: |
            vystup/*.csv
            vystup/stav_dat.json
            ciselniky/*.csv
